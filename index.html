<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a14">
<title>Grimoire – Blood on the Clocktower</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Top bar ===== -->
<header id="topbar">
  <div class="tb-left">
    <button id="btnMenu" class="iconbtn" title="Menü">☰</button>
    <button id="btnInfo" class="iconbtn" title="Skript-Übersicht">ℹ️</button>
    <span id="phaseLabel" class="phase-label">Grimoire</span>
  </div>
  <div class="tb-center">
    <button id="btnTimer" class="iconbtn" title="Timer">⏳</button>
    <span id="timerDisplay" class="timer-display hidden"></span>
  </div>
  <div class="tb-right">
    <button id="btnAudio" class="iconbtn" title="Sounds">♫</button>
    <button id="btnCandles" class="iconbtn" title="Kerzen">🕯</button>
    <button id="btnShield" class="iconbtn shield" title="Bildschirm verdecken">👁</button>
  </div>
</header>

<!-- ===== Main stage: town circle ===== -->
<main id="stage">
  <div id="circle"></div>
  <div id="centerInfo"></div>
</main>

<!-- ===== Bottom bar ===== -->
<footer id="bottombar">
  <button id="btnPhase" class="bigbtn">🌙 Nacht beginnen</button>
  <button id="btnNightOrder" class="bigbtn">📜 Nacht-Reihenfolge</button>
  <button id="btnVote" class="bigbtn">⚖️ Nominierung</button>
  <button id="btnBluffs" class="bigbtn">🎭 Bluffs</button>
  <button id="btnLog" class="bigbtn">📖 Chronik</button>
</footer>

<!-- ===== Panels / overlays (filled by JS) ===== -->
<div id="panel" class="panel hidden"></div>
<div id="overlay" class="overlay hidden"></div>
<div id="shield" class="shield-screen hidden">
  <div class="shield-inner">
    <div class="shield-clock">🕰</div>
    <div class="shield-text">Der Erzähler denkt nach&nbsp;…</div>
    <div class="shield-hint">Zum Entsperren 3× tippen</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
